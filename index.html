<!doctype html>
<html lang="ru" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2937" />
    <meta
      name="description"
      content="Godot 4 — пошаговое руководство на русском: 12 этапов, 24 недели, от первого запуска редактора до релиза собственной игры."
    />
    <title>Godot 4 — пошаговое руководство</title>
    <script>
      // Тема применяется до первой отрисовки, чтобы не было «мигания» светлой темы.
      ;(function () {
        try {
          var stored = localStorage.getItem('godot-plan:v1:theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored ? stored === 'dark' : prefersDark
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* localStorage может быть недоступен — просто останется светлая тема */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
